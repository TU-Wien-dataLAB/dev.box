name: publish patched ContainerSSH server

on:
  push:
    branches: [main, master]
    paths:
      - containerssh-server/**
      - .github/workflows/containerssh-server-image.yml
      - tests/containerssh-server-regression.sh
      - tests/ssh-advertisement-harness_test.go
      - tests/ssh-auth-advertisement.py
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.3'
          cache: false
      - name: Prepare pinned, patched upstream source
        run: containerssh-server/prepare-source.sh containerssh-server/source
      - name: Verify SSH behavior and typecheck affected packages
        run: |
          tests/containerssh-server-regression.sh containerssh-server/source
          cd containerssh-server/source
          go test ./internal/sshserver -timeout 10m
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute artifact identity
        id: identity
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/containerssh-server:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "patch=$(sha256sum containerssh-server/patches/0001-authentication-methods.patch | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          rm -rf containerssh-server/source/.git
      - name: Build and publish server only
        id: build
        uses: docker/build-push-action@v6
        with:
          context: containerssh-server
          platforms: linux/amd64
          push: true
          tags: ${{ steps.identity.outputs.image }}
          build-args: PATCH_SHA256=${{ steps.identity.outputs.patch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record immutable deployment reference
        run: echo '${{ steps.identity.outputs.image }}@${{ steps.build.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"
