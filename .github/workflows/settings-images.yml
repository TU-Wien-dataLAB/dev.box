name: publish settings POC images

on:
  push:
    branches: [main, master]
    paths:
      - settings-tui/**
      - containerssh-settings/**
      - .github/workflows/settings-images.yml
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [settings-tui, containerssh-settings]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Normalize registry repository
        id: repository
        shell: bash
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ steps.repository.outputs.name }}/${{ matrix.image }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
