name: publish settings TUI image

on:
  push:
    branches: [main, master]
    paths:
      - settings-tui/**
      - .github/workflows/settings-images.yml
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Normalize registry repository
        id: repository
        shell: bash
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: settings-tui
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ steps.repository.outputs.name }}/settings-tui:sha-${{ github.sha }}
          cache-from: type=gha,scope=settings-tui
          cache-to: type=gha,mode=max,scope=settings-tui
