name: publish auth-server image

# Builds dev.box/auth-server and publishes it to GHCR so the cluster can pull
# it. Change `authServer.image` in charts/containerssh/values.yaml to the
# ghcr.io image below after the first run (see AGENTS.md).
#
# Package naming (ghcr, scoped to this repo):
#   ghcr.io/<owner>/<repo>/auth-server
#
# After the first successful run you must let the cluster pull it, one of:
#   * make the package public, or
#   * create an imagePullSecret for GHCR and set values.imagePullSecrets
# (see AGENTS.md -> Deployment status).

on:
  push:
    branches: ["main", "master"]
    tags: ["v*"]
  workflow_dispatch:

env:
  IMAGE_NAME: auth-server

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: auth-server
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
