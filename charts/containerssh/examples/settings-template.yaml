# Append this item to the EXISTING kubernetes.podTemplates list; do not replace it.
# Build/publish settings-tui first, then replace the image with an immutable tag/digest.
name: settings
mode: connection
shellCommand: [/usr/local/bin/dev-box-settings]
metadata:
  generateName: settings-
  labels:
    dev.box/application: settings
security:
  defaultMode: disable
  forceCommand: /usr/local/bin/dev-box-settings
  shell:
    mode: enable
  tty:
    mode: enable
  command:
    mode: disable
  subsystem:
    mode: disable
  env:
    mode: disable
  signal:
    mode: disable
  forwarding:
    forwardingMode: disable
    reverseForwardingMode: disable
    socketForwardingMode: disable
    socketListenMode: disable
    x11ForwardingMode: disable
  maxSessions: 1
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  terminationGracePeriodSeconds: 5
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: settings
      image: ghcr.io/tu-wien-datalab/dev.box/settings-tui:sha-REPLACE_WITH_COMMIT
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
      resources:
        requests:
          cpu: 50m
          memory: 16Mi
        limits:
          cpu: 500m
          memory: 128Mi
