{{- /*
Bundled pod-template configuration server (dev.box/config-server).
Rendered only when configServer.enabled=true: a ConfigMap with the pod templates
from values.kubernetes.podTemplates, plus a Deployment and a Service that serve
the template matching the SSH username exactly (no fallback). configserver.url is auto-wired to
this Service in configmap.yaml.

The server gets its OWN ServiceAccount for the persistent cap and per-owner
ServiceAccount/Role/RoleBinding reconciliation in the session namespace. Holding
get/delete on pods allows it to delegate the owner's exact pod names without
escalate or bind (the gateway's pod-management Role is unchanged).
*/}}
{{- define "containerssh.templateConfigMap" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "containerssh.fullname" . }}-templates
  labels:
    {{- include "containerssh.labels" . | nindent 4 }}
    app.kubernetes.io/component: config-server
data:
  {{- range $i, $tpl := .Values.kubernetes.podTemplates }}
  {{- $spec := deepCopy (default dict $tpl.spec) }}
  {{- if and $.Values.kata.enabled (not (hasKey $spec "runtimeClassName")) }}
  {{- $_ := set $spec "runtimeClassName" "kata-qemu-runtime-rs" }}
  {{- end }}
  {{ default (printf "template-%d" $i) $tpl.name }}.yaml: |
    {{- with $tpl.security }}
    security:
{{ toYaml . | indent 6 }}
    {{- end }}
    {{- with $tpl.volumeClaimTemplates }}
    volumeClaimTemplates:
{{ toYaml . | indent 6 }}
    {{- end }}
    kubernetes:
      pod:
    {{- with $tpl.mode }}
        mode: {{ . | quote }}
    {{- end }}
    {{- with $tpl.shellCommand }}
        shellCommand:
{{ toYaml . | indent 10 }}
    {{- end }}
    {{- with $tpl.metadata }}
        metadata:
{{ toYaml . | indent 10 }}
    {{- end }}
    {{- with $spec }}
        spec:
{{ toYaml . | indent 10 }}
    {{- end }}
  {{- end }}
{{- end }}
{{- if .Values.configServer.enabled }}
---
{{ include "containerssh.templateConfigMap" . }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "containerssh.fullname" . }}-config-server
  labels:
    {{- include "containerssh.labels" . | nindent 4 }}
    app.kubernetes.io/component: config-server
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "containerssh.fullname" . }}-config-server
  namespace: {{ .Values.kubernetes.sessionNamespace }}
  labels:
    {{- include "containerssh.labels" . | nindent 4 }}
    app.kubernetes.io/component: config-server
rules:
  {{- if include "containerssh.managedStorage" . }}
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "create"]
  {{- end }}
  - apiGroups: [""]
    resources: ["pods"]
    # List for the cap; get/delete can be delegated to name-scoped owner Roles.
    verbs: ["list", "get", "delete"]
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get", "list", "create", "update"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["get", "list", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "containerssh.fullname" . }}-config-server
  namespace: {{ .Values.kubernetes.sessionNamespace }}
  labels:
    {{- include "containerssh.labels" . | nindent 4 }}
    app.kubernetes.io/component: config-server
subjects:
  - kind: ServiceAccount
    name: {{ include "containerssh.fullname" . }}-config-server
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "containerssh.fullname" . }}-config-server
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "containerssh.fullname" . }}-config-server
  labels:
    {{- include "containerssh.labels" . | nindent 4 }}
    app.kubernetes.io/component: config-server
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "containerssh.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: config-server
  template:
    metadata:
      annotations:
        checksum/templates: {{ include "containerssh.templateConfigMap" . | sha256sum }}
      labels:
        {{- include "containerssh.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: config-server
    spec:
      serviceAccountName: {{ include "containerssh.fullname" . }}-config-server
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: config-server
          image: "{{ .Values.configServer.image.repository }}:{{ .Values.configServer.image.tag }}"
          imagePullPolicy: {{ .Values.configServer.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: CONTAINERSSH_SETTINGS_IMAGE
              value: {{ include "containerssh.settingsImage" . | quote }}
            - name: CONTAINERSSH_CONFIG_DIR
              value: /config
            - name: CONTAINERSSH_LISTEN
              value: 0.0.0.0:8080
            - name: CONTAINERSSH_LOG_LEVEL
              value: {{ .Values.configServer.logLevel | quote }}
            # Persistent-mode identity/label injection + box cap are turned on by
            # rendering the chart's kubernetes.mode into the server. The server
            # reaches the Kubernetes API in-cluster via its own ServiceAccount.
            - name: CONTAINERSSH_OPERATING_MODE
              value: {{ .Values.kubernetes.mode | quote }}
            - name: CONTAINERSSH_SESSION_NAMESPACE
              value: {{ .Values.kubernetes.sessionNamespace | quote }}
            - name: CONTAINERSSH_MAX_PODS_PER_USER
              value: {{ .Values.configServer.maxPodsPerUser | quote }}
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.configServer.resources | nindent 12 }}
          volumeMounts:
            - name: templates
              mountPath: /config
              readOnly: true
      volumes:
        - name: templates
          configMap:
            name: {{ include "containerssh.fullname" . }}-templates
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "containerssh.fullname" . }}-config-server
  labels:
    {{- include "containerssh.labels" . | nindent 4 }}
    app.kubernetes.io/component: config-server
spec:
  type: ClusterIP
  selector:
    {{- include "containerssh.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: config-server
  ports:
    - name: http
      port: 8080
      targetPort: http
{{- end }}
