{{- if .Values.rbac.enabled }}
{{- $sessionNS := .Values.kubernetes.sessionNamespace }}
{{- if and .Values.kubernetes.createSessionNamespace (ne $sessionNS .Release.Namespace) }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $sessionNS }}
  # NOTE: deliberately no pod-security enforce label here — ContainerSSH's
  # backend user-pod spec is configurable and an enforced restricted profile
  # (which requires seccompProfile: RuntimeDefault) would block default pods. See README.
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: containerssh
  namespace: {{ $sessionNS }}
  labels:
    {{- include "containerssh.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "pods/exec"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: containerssh
  namespace: {{ $sessionNS }}
  labels:
    {{- include "containerssh.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "containerssh.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: containerssh
  apiGroup: rbac.authorization.k8s.io
{{- end }}
